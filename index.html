<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Бабушкин дом</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- SDK отдаёт сервер Яндекс Игр; локально файла нет, игра работает без него -->
  <script src="/sdk.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header>
    <h1 id="title">Уровень 1</h1>
    <span id="stars">★ 0</span>
    <button id="restart" type="button">Заново</button>
  </header>
  <section id="hud">
    <div id="moves"><b>20</b><small>ходов</small></div>
    <div id="goals"></div>
  </section>
  <main id="board"><div id="grid"></div></main>
  <p id="info"></p>
  <div id="overlay" hidden>
    <div class="panel">
      <p id="overlay-text"></p>
      <button id="overlay-btn" type="button"></button>
    </div>
  </div>
</body>
</html>
